name: Release bootable ISO

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish amd64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install --yes live-build

      - name: Build ReBoot ISO
        run: ./boot-environment/scripts/build-debian.sh --clean

      - name: Verify release artifacts
        working-directory: boot-environment
        run: |
          test -s live-image-amd64.hybrid.iso
          test -s live-image-amd64.packages
          test -s live-image-amd64-source.debian.tar
          test -s live-image-amd64-source.live.tar
          sha256sum --check live-image-amd64.hybrid.iso.sha256
          sha256sum --check live-image-amd64.sources.sha256

      - name: Split corresponding source for GitHub
        working-directory: boot-environment
        run: |
          for archive in live-image-amd64-source.debian.tar live-image-amd64-source.live.tar; do
            split \
              --bytes=1900M \
              --numeric-suffixes=0 \
              --suffix-length=2 \
              "$archive" \
              "$archive.part-"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            boot-environment/live-image-amd64.hybrid.iso \
            boot-environment/live-image-amd64.hybrid.iso.sha256 \
            boot-environment/live-image-amd64.packages \
            boot-environment/live-image-amd64.sources.sha256 \
            boot-environment/live-image-amd64-source.debian.tar.part-* \
            boot-environment/live-image-amd64-source.live.tar.part-* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ReBoot ${GITHUB_REF_NAME}" \
            --notes-file boot-environment/RELEASE_NOTES.md \
            --verify-tag
